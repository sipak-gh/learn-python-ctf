# challenges.toml -- the curated, retired, organizer-published CTF challenges
# used by "Learn Python for CTFs", each pinned to an exact commit.
#
# IMPORTANT (licensing): challenge files are NOT committed to this repo. This
# manifest only records *where* each challenge lives so `fetch.py` can pull it
# to your machine on demand (into challenges/<name>/, which is gitignored).
# Attribution + license for each is in Appendix D.
#
# Every entry:
#   repo   = "owner/name"      GitHub repository
#   commit = "<40-hex>"        pinned commit (reproducible fetch)
#   path   = "dir/in/repo"     directory to download (whole subtree)
#   category / difficulty / needs_service / license  = metadata for Appendix D
#   event / author            = attribution

