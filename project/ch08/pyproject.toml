[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfkit"
version = "0.12.0"
description = "A small, readable toolkit for solving CTF challenges (Learn Python for CTFs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Learn Python for CTFs" }]
dependencies = [
    "pwntools>=4.15,<5",
    "pycryptodome>=4,<5",
    "requests>=2.31",
    "scapy>=2.5",
    "Pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]
rev = ["decompyle3>=3.9"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["ctfkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
